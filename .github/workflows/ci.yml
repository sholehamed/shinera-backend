name: Backend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ShineraApp.slnx
      - run: dotnet build ShineraApp.slnx --no-restore --configuration Release
      - run: dotnet test tests/ShineraApp.Tests/ShineraApp.Tests.csproj --no-build --configuration Release --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
