name: backend-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore shinera-back.slnx

      - name: Build
        run: dotnet build shinera-back.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test shinera-back.slnx --configuration Release --no-build --verbosity normal
