name: backend-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore shinera-back.slnx

      - name: Build
        run: dotnet build shinera-back.slnx --configuration Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Verify Identity migration chain
        run: |
          dotnet ef migrations script --idempotent \
            --project Modules.Identity/Modules.Identity.csproj \
            --startup-project Web/Web.csproj \
            --context IdentityDbContext \
            --output /tmp/identity-migrations.sql
          test -s /tmp/identity-migrations.sql

      - name: Verify Subscription migration chain
        run: |
          dotnet ef migrations script --idempotent \
            --project Modules.Subscription/Modules.Subscription.csproj \
            --startup-project Web/Web.csproj \
            --context SubscriptionDbContext \
            --output /tmp/subscription-migrations.sql
          test -s /tmp/subscription-migrations.sql

      - name: Verify Services migration chain
        run: |
          dotnet ef migrations script --idempotent \
            --project Modules.Services/Modules.Services.csproj \
            --startup-project Web/Web.csproj \
            --context ServicesDbContext \
            --output /tmp/services-migrations.sql
          test -s /tmp/services-migrations.sql

      - name: Test
        run: dotnet test shinera-back.slnx --configuration Release --no-build --verbosity normal
